services:
  postgres:
    image: postgres:16-alpine
    container_name: used-car-crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: used_car_crm
      POSTGRES_USER: used_car
      POSTGRES_PASSWORD: used_car_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: used-car-crm-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
